<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sea" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1d33"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset=".5" stop-color="#f5b820"/>
      <stop offset="1" stop-color="#a86c12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sea)"/>
  <g transform="translate(0 30)">
  <circle cx="256" cy="250" r="150" fill="#f5b820" opacity=".18"/>
  <!-- open lid -->
  <path d="M128 228 V176 Q128 110 256 110 Q384 110 384 176 V228 Z" fill="url(#wood)" stroke="#3d1e07" stroke-width="10" transform="rotate(-32 128 228)"/>
  <!-- coins spilling out -->
  <ellipse cx="256" cy="232" rx="118" ry="26" fill="url(#gold)"/>
  <circle cx="200" cy="214" r="22" fill="url(#gold)" stroke="#a86c12" stroke-width="4"/>
  <circle cx="300" cy="208" r="22" fill="url(#gold)" stroke="#a86c12" stroke-width="4"/>
  <circle cx="252" cy="196" r="24" fill="url(#gold)" stroke="#a86c12" stroke-width="4"/>
  <!-- body -->
  <rect x="120" y="232" width="272" height="150" rx="16" fill="url(#wood)" stroke="#3d1e07" stroke-width="10"/>
  <rect x="120" y="282" width="272" height="22" fill="url(#gold)" stroke="#3d1e07" stroke-width="6"/>
  <rect x="168" y="232" width="22" height="150" fill="url(#gold)" stroke="#3d1e07" stroke-width="6"/>
  <rect x="322" y="232" width="22" height="150" fill="url(#gold)" stroke="#3d1e07" stroke-width="6"/>
  <rect x="232" y="268" width="48" height="56" rx="8" fill="url(#gold)" stroke="#3d1e07" stroke-width="7"/>
  <circle cx="256" cy="290" r="7" fill="#3d1e07"/>
  <path d="M256 290 v18" stroke="#3d1e07" stroke-width="7" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M396 120 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#ffe28a"/>
  <path d="M112 140 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#ffe28a" opacity=".8"/>
  </g>
</svg>
